name: エックスサーバーに公開

# main に取り込まれたら自動で公開。Actions 画面から手動でも実行できます。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # リポジトリの Settings → Secrets and variables → Actions に
      # FTP_SERVER（例 sv12345.xserver.jp）・FTP_USERNAME・FTP_PASSWORD を登録してください。
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./nekoyashiki.life/public_html/
